<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тимофей & Анна</title>
    <style>
        :root {
            --bg-warm: #fef9f0;
            --card-kid: #fff3e4;
            --card-parent: #f0e6f6;
            --accent-kid: #f7974b;
            --accent-parent: #8b5e9e;
            --text-dark: #3d2e1e;
            --text-soft: #5c4a3a;
            --shadow-soft: 0 8px 32px rgba(80, 40, 10, 0.08);
            --shadow-hover: 0 14px 40px rgba(80, 40, 10, 0.14);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --font-xl: clamp(2.4rem, 6vw, 4.5rem);
            --font-lg: clamp(1.6rem, 3.5vw, 2.6rem);
            --font-md: clamp(1.1rem, 2vw, 1.4rem);
            --font-sm: clamp(0.95rem, 1.6vw, 1.15rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(170deg, #fef7ed 0%, #fdecd7 25%, #fdf1e5 50%, #f8ecf9 80%, #fef7ed 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные фоновые круги */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 180, 110, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatBlob1 14s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -160px;
            left: -100px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(180, 140, 210, 0.22) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatBlob2 18s ease-in-out infinite;
        }

        @keyframes floatBlob1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-40px, 30px) scale(1.08);
            }
            50% {
                transform: translate(20px, -20px) scale(0.94);
            }
            75% {
                transform: translate(-15px, -35px) scale(1.05);
            }
        }
        @keyframes floatBlob2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            30% {
                transform: translate(35px, -25px) scale(1.1);
            }
            60% {
                transform: translate(-25px, 20px) scale(0.92);
            }
            85% {
                transform: translate(10px, 30px) scale(1.04);
            }
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Заголовок */
        .site-title {
            text-align: center;
            font-size: var(--font-lg);
            font-weight: 700;
            color: #5c3d2e;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .site-title .heart-icon {
            display: inline-block;
            font-size: 1.3em;
            animation: heartbeat 1.3s ease-in-out infinite;
            vertical-align: middle;
            margin: 0 6px;
            color: #e8726a;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            12% {
                transform: scale(1.22);
            }
            24% {
                transform: scale(1);
            }
            36% {
                transform: scale(1.18);
            }
            50% {
                transform: scale(1);
            }
        }
        .site-subtitle {
            display: block;
            font-size: var(--font-sm);
            font-weight: 400;
            color: #8a6e58;
            margin-top: 6px;
            letter-spacing: 0.03em;
        }

        /* Карточки */
        .cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        @media (max-width: 600px) {
            .cards-row {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            body {
                padding: 20px 14px;
            }
        }

        .card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 34px 28px 30px;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1.5px solid transparent;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }
        .card::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            opacity: 0.10;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .card:hover::after {
            opacity: 0.18;
        }

        /* Карточка ребёнка */
        .card--kid {
            border-color: #ffe0c4;
            background: linear-gradient(180deg, #fffbf6 0%, #fff5e8 60%, #fffaf4 100%);
        }
        .card--kid::after {
            background: #f7974b;
        }
        .card--kid .card__icon-ring {
            background: #fff3e4;
            box-shadow: 0 0 0 8px #fff3e4;
        }

        /* Карточка родителя */
        .card--parent {
            border-color: #e4d6f0;
            background: linear-gradient(180deg, #fefcff 0%, #f7effb 60%, #fdfafd 100%);
        }
        .card--parent::after {
            background: #8b5e9e;
        }
        .card--parent .card__icon-ring {
            background: #f0e6f6;
            box-shadow: 0 0 0 8px #f0e6f6;
        }

        .card__icon-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 18px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            z-index: 1;
        }
        .card:hover .card__icon-ring {
            transform: scale(1.08) rotate(-4deg);
        }
        .card__label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        .card--kid .card__label {
            color: #e07b30;
        }
        .card--parent .card__label {
            color: #7b4f8a;
        }
        .card__name {
            font-size: var(--font-lg);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
            color: var(--text-dark);
            line-height: 1.1;
        }
        .card__detail {
            font-size: var(--font-md);
            font-weight: 500;
            color: var(--text-soft);
            position: relative;
            z-index: 1;
            line-height: 1.5;
        }
        .card__detail strong {
            font-weight: 700;
            color: #3d2e1e;
        }
        .card__detail .highlight {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 700;
            margin-top: 4px;
            font-size: 0.95em;
        }
        .card--kid .highlight {
            background: #fff0dd;
            color: #d4732a;
        }
        .card--parent .highlight {
            background: #f3e9fa;
            color: #6d3d82;
        }
        .card__emoji-accent {
            font-size: 1.6em;
            vertical-align: middle;
            margin-left: 2px;
        }

        /* Связующая полоска */
        .bond-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #ffffffdd;
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            padding: 18px 28px;
            box-shadow: var(--shadow-soft);
            font-size: var(--font-md);
            font-weight: 600;
            color: #5c3d2e;
            letter-spacing: -0.01em;
            border: 1.5px solid #f3e5d8;
            flex-wrap: wrap;
            text-align: center;
            transition: box-shadow 0.4s;
        }
        .bond-strip:hover {
            box-shadow: var(--shadow-hover);
        }
        .bond-strip .bond-icon {
            font-size: 2rem;
            animation: gentleBounce 2.2s ease-in-out infinite;
        }
        @keyframes gentleBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-9px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-4px);
            }
            85% {
                transform: translateY(0);
            }
        }

        /* Футер */
        .footer-note {
            text-align: center;
            font-size: 0.9rem;
            color: #b8a28c;
            letter-spacing: 0.04em;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Заголовок -->
        <div class="site-title">
            Семья — это
            <span class="heart-icon">❤️</span>
            тепло
            <span class="site-subtitle">история двух сердец</span>
        </div>

        <!-- Карточки -->
        <div class="cards-row">
            <!-- Карточка ребёнка: Тимофей -->
            <div class="card card--kid">
                <div class="card__icon-ring">🧒</div>
                <div class="card__label">Ребёнок</div>
                <div class="card__name">Тимофей</div>
                <div class="card__detail">
                    <strong>10 лет</strong><br>
                    Мечтает стать<br>
                    <span class="highlight">
                        блогером <span class="card__emoji-accent">🎥✨</span>
                    </span>
                </div>
            </div>

            <!-- Карточка родителя: Анна -->
            <div class="card card--parent">
                <div class="card__icon-ring">👩‍✈️</div>
                <div class="card__label">Родитель</div>
                <div class="card__name">Анна</div>
                <div class="card__detail">
                    Работает в<br>
                    <span class="highlight">
                        полиции <span class="card__emoji-accent">🛡️🚔</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Связующая полоса -->
        <div class="bond-strip">
            <span class="bond-icon">🌟</span>
            <span>Мама оберегает город, а&nbsp;сын мечтает покорить интернет</span>
            <span class="bond-icon">💫</span>
        </div>

        <!-- Тёплая подпись -->
        <div class="footer-note">
            Вместе — сила. Вместе — семья.
        </div>
    </div>

</body>
</html>
